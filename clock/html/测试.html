<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>翻页时钟 | Flip Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e27;
            --bg-secondary: #1a1f3a;
            --accent-primary: #00d9ff;
            --accent-secondary: #ff006e;
            --text-primary: #ffffff;
            --text-secondary: #8892b0;
            --card-bg: #151a2e;
            --card-shadow: rgba(0, 217, 255, 0.15);
            --flip-duration: 600ms;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* 背景动画网格 */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                linear-gradient(rgba(0, 217, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 217, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridScroll 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridScroll {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* 光晕效果 */
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 217, 255, 0.1) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0;
            animation: titleFadeIn 1s ease-out 0.3s forwards;
        }

        @keyframes titleFadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clock {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            justify-content: center;
            opacity: 0;
            animation: clockFadeIn 1s ease-out 0.6s forwards;
        }

        @keyframes clockFadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .digit-group {
            display: flex;
            gap: 0.5rem;
        }

        .separator {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: var(--accent-primary);
            display: flex;
            align-items: center;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 49%, 100% { opacity: 1; }
            50%, 99% { opacity: 0.3; }
        }

        .digit-container {
            perspective: 1000px;
            width: 100px;
            height: 140px;
            position: relative;
        }

        .digit-card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
        }

        /* 上半部分 - 静态显示（始终显示 lastClockTime） */
        .digit-upper {
            position: absolute;
            width: 100%;
            height: 70px;
            top: 0;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-bottom: 0.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 8px 8px 0 0;
            box-shadow: 
                0 0 20px var(--card-shadow),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
            z-index: 1;
        }

        /* 下半部分 - 静态显示（始终显示 lastClockTime） */
        .digit-lower {
            position: absolute;
            width: 100%;
            height: 70px;
            bottom: 0;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-top: 0.5px solid rgba(0, 217, 255, 0.3);
            border-radius: 0 0 8px 8px;
            box-shadow: 
                0 0 20px var(--card-shadow),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
            z-index: 1;
        }

        /* 数字显示 - 完整的数字 */
        .digit-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 140px;
            text-align: center;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            position: absolute;
            width: 100%;
            left: 0;
        }

        /* 上半部分的数字定位 */
        .digit-upper .digit-value {
            top: 0;
        }

        /* 下半部分的数字定位 - 向上偏移显示下半 */
        .digit-lower .digit-value {
            top: -70px;
        }

        /* 翻页片 */
        .flip-card {
            position: absolute;
            width: 100%;
            height: 70px;
            top: 0;
            transform-origin: bottom;
            transform-style: preserve-3d;
            pointer-events: none;
            z-index: 10;
        }

        .flip-card.flipping {
            animation: flipDown var(--flip-duration) cubic-bezier(0.455, 0.03, 0.515, 0.955);
        }

        @keyframes flipDown {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-180deg); }
        }

        .flip-card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            backface-visibility: hidden;
            background: var(--card-bg);
            border: 1px solid rgba(0, 217, 255, 0.2);
            box-shadow: 
                0 0 20px var(--card-shadow),
                inset 0 0 20px rgba(0, 217, 255, 0.05);
        }

        .flip-card-front {
            border-radius: 8px 8px 0 0;
            border-bottom: 0.5px solid rgba(0, 217, 255, 0.3);
        }

        .flip-card-back {
            transform: rotateX(-180deg);
            border-radius: 0 0 8px 8px;
            border-top: 0.5px solid rgba(0, 217, 255, 0.3);
        }

        .flip-card-face .digit-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            line-height: 140px;
            text-align: center;
            color: var(--text-primary);
            text-shadow: 0 0 10px rgba(0, 217, 255, 0.5);
            position: absolute;
            width: 100%;
            left: 0;
        }

        /* 翻页片正面 - 显示旧数字的上半部分 */
        .flip-card-front .digit-value {
            top: 0;
        }

        /* 翻页片背面 - 显示新数字的下半部分 */
        .flip-card-back .digit-value {
            top: -70px;
        }

        /* 状态指示器 */
        .status {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            background: rgba(21, 26, 46, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid rgba(0, 217, 255, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-primary);
            animation: statusPulse 2s ease-in-out infinite;
        }

        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .title {
                font-size: 0.9rem;
                margin-bottom: 2rem;
            }

            .clock {
                gap: 1rem;
            }

            .digit-container {
                width: 70px;
                height: 100px;
            }

            .digit-upper,
            .digit-lower {
                height: 50px;
            }

            .digit-value,
            .flip-card-face .digit-value {
                font-size: 3.5rem;
                line-height: 100px;
            }

            .digit-lower .digit-value,
            .flip-card-back .digit-value {
                top: -50px;
            }

            .separator {
                font-size: 3rem;
            }

            .status {
                font-size: 0.65rem;
                padding: 0.4rem 0.8rem;
                gap: 0.5rem;
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Flip Clock</div>
        <div class="clock">
            <!-- 时 -->
            <div class="digit-group">
                <div class="digit-container" data-digit="hoursTens">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
                <div class="digit-container" data-digit="hoursOnes">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="separator">:</div>

            <!-- 分 -->
            <div class="digit-group">
                <div class="digit-container" data-digit="minutesTens">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
                <div class="digit-container" data-digit="minutesOnes">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="separator">:</div>

            <!-- 秒 -->
            <div class="digit-group">
                <div class="digit-container" data-digit="secondsTens">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
                <div class="digit-container" data-digit="secondsOnes">
                    <div class="digit-card">
                        <div class="digit-upper">
                            <div class="digit-value">0</div>
                        </div>
                        <div class="digit-lower">
                            <div class="digit-value">0</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="status">
        <div class="status-item">
            <div class="status-dot"></div>
            <span id="status-state">INIT</span>
        </div>
        <div class="status-item">
            <span id="status-time">--:--:--</span>
        </div>
    </div>

    <script>
        /*
         * ═══════════════════════════════════════════════════════════════════
         * 翻页时钟 - 技术设计文档
         * ═══════════════════════════════════════════════════════════════════
         * 
         * 【核心模型】
         * 严格状态机 + 逻辑时钟 + 物理翻页
         * 
         * 【三大核心问题及解决方案】
         * 
         * 问题1：翻页完成后上半部分才更新
         * ─────────────────────────────────────────────
         * 现象：翻页动画结束，下半已是新数字，但上半还是旧数字
         * 原因：静态显示依赖 lastClockTime，更新顺序错误
         * 方案：先更新所有 DOM 显示，再统一更新 lastClockTime
         * 原则：DOM 显示由动画结果直接驱动，不等状态
         * 
         * 问题2：后台恢复时疯狂快翻
         * ─────────────────────────────────────────────
         * 现象：页面从后台切回，时钟快速连续翻动
         * 原因：逻辑时间被冻结，恢复后试图补历史翻页
         * 方案1：PAUSED 状态强制时间同步（直接抹平时间差）
         * 方案2：justResumed 防抖标志（跳过恢复后第一帧）
         * 原则：后台恢复 ≠ 补动画，而是一次性对齐真实时间
         * 
         * 问题3：翻页过程中时间逻辑不稳定
         * ─────────────────────────────────────────────
         * 现象：翻页中偶发错位、撕裂
         * 原因：FLIPPING 状态中读取时间导致动画与数据源不同步
         * 方案：强约束状态机职责，FLIPPING 是纯动画态
         * 原则：翻页过程中只推进动画，不修改任何时间逻辑
         * 
         * 【状态机职责表】
         * ┌────────────┬──────────────┬─────────────────────┐
         * │ 状态       │ 允许读取时间 │ 允许改 lastClockTime │
         * ├────────────┼──────────────┼─────────────────────┤
         * │ INIT       │ ✅           │ ✅ (初始化)          │
         * │ STABLE     │ ✅           │ ❌                  │
         * │ FLIP_START │ ❌           │ ❌                  │
         * │ FLIPPING   │ ❌ 纯动画态   │ ❌ 严格禁止          │
         * │ FLIP_END   │ ❌           │ ✅ (提交结果)        │
         * │ PAUSED     │ ✅           │ ✅ (时间对齐)        │
         * └────────────┴──────────────┴─────────────────────┘
         * 
         * 【核心设计原则】
         * 1. 翻页结果直接驱动 DOM（不等状态）
         * 2. lastClockTime 仅在受控节点修改
         * 3. 后台恢复时强制时间对齐（不补动画）
         * 
         * 【避免的问题】
         * - 上下半显示不同步
         * - 后台恢复快翻
         * - 动画与时间源撕裂
         * 
         * ═══════════════════════════════════════════════════════════════════
         */

        // ============================================
        // 状态枚举
        // ============================================
        const State = Object.freeze({
            INIT: 'INIT',
            STABLE: 'STABLE',
            FLIP_START: 'FLIP_START',
            FLIPPING: 'FLIPPING',
            FLIP_END: 'FLIP_END',
            PAUSED: 'PAUSED'
        });

        // ============================================
        // 翻页片类（严格不可变）
        // ============================================
        class FlipPage {
            constructor({ topFace, bottomFace, element }) {
                this.topFace = topFace;        // 新数字
                this.bottomFace = bottomFace;  // 旧数字
                this.element = element;        // DOM 元素
                this.startTime = performance.now();
                Object.freeze(this);  // 冻结后不可修改
            }
        }

        // ============================================
        // 数字位单元类
        // ============================================
        class DigitUnit {
            constructor(key, element) {
                this.key = key;
                this.value = 0;
                this.element = element;
                this.flipPage = null;
                this.upperElement = element.querySelector('.digit-upper .digit-value');
                this.lowerElement = element.querySelector('.digit-lower .digit-value');
            }

            // 设置静态显示（上下两半显示同一个数字）
            setDisplay(value) {
                this.value = value;
                this.upperElement.textContent = value;
                this.lowerElement.textContent = value;
            }

            // 创建翻页 DOM 元素（修复：正确绑定 bottomFace 和 topFace）
            createFlipElement(topFace, bottomFace) {
                const flipCard = document.createElement('div');
                flipCard.className = 'flip-card';
                
                // ✅ 修复：front 显示旧数字（bottomFace），back 显示新数字（topFace）
                flipCard.innerHTML = `
                    <div class="flip-card-face flip-card-front">
                        <div class="digit-value">${bottomFace}</div>
                    </div>
                    <div class="flip-card-face flip-card-back">
                        <div class="digit-value">${topFace}</div>
                    </div>
                `;

                this.element.querySelector('.digit-card').appendChild(flipCard);
                return flipCard;
            }

            // 销毁翻页元素
            destroyFlipElement() {
                if (this.flipPage && this.flipPage.element) {
                    this.flipPage.element.remove();
                }
                this.flipPage = null;
            }
        }

        // ============================================
        // 全局状态
        // ============================================
        const clockState = {
            state: State.INIT,
            previousState: null,
            lastClockTime: {
                hoursTens: 0,
                hoursOnes: 0,
                minutesTens: 0,
                minutesOnes: 0,
                secondsTens: 0,
                secondsOnes: 0
            },
            currentTime: null,  // 缓存的当前时间
            pageVisible: true,
            justResumed: false,  // ✅ 修复问题2：添加恢复标志，防止疯狂快翻
            digits: {}
        };

        // 配置
        const FLIP_DURATION = 600; // 毫秒

        // ============================================
        // 初始化数字位
        // ============================================
        function initDigits() {
            const digitElements = document.querySelectorAll('[data-digit]');
            digitElements.forEach(elem => {
                const key = elem.getAttribute('data-digit');
                clockState.digits[key] = new DigitUnit(key, elem);
            });
        }

        // ============================================
        // 时间工具函数
        // ============================================
        function getNow() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            return {
                hoursTens: Math.floor(hours / 10),
                hoursOnes: hours % 10,
                minutesTens: Math.floor(minutes / 10),
                minutesOnes: minutes % 10,
                secondsTens: Math.floor(seconds / 10),
                secondsOnes: seconds % 10
            };
        }

        // 递增一秒（逻辑时钟）
        function incrementOneSecond(timeObj) {
            let { hoursTens, hoursOnes, minutesTens, minutesOnes, secondsTens, secondsOnes } = timeObj;
            
            // 秒+1
            secondsOnes++;
            if (secondsOnes > 9) {
                secondsOnes = 0;
                secondsTens++;
                if (secondsTens > 5) {
                    secondsTens = 0;
                    // 分+1
                    minutesOnes++;
                    if (minutesOnes > 9) {
                        minutesOnes = 0;
                        minutesTens++;
                        if (minutesTens > 5) {
                            minutesTens = 0;
                            // 时+1
                            hoursOnes++;
                            if (hoursTens === 2 && hoursOnes > 3) {
                                hoursTens = 0;
                                hoursOnes = 0;
                            } else if (hoursOnes > 9) {
                                hoursOnes = 0;
                                hoursTens++;
                                if (hoursTens > 2) {
                                    hoursTens = 0;
                                }
                            }
                        }
                    }
                }
            }

            return { hoursTens, hoursOnes, minutesTens, minutesOnes, secondsTens, secondsOnes };
        }

        // t1 是否 >= t2
        function timeAfterOrEqual(t1, t2) {
            const toNumber = (t) => {
                return t.hoursTens * 100000 +
                       t.hoursOnes * 10000 +
                       t.minutesTens * 1000 +
                       t.minutesOnes * 100 +
                       t.secondsTens * 10 +
                       t.secondsOnes;
            };
            return toNumber(t1) >= toNumber(t2);
        }

        function formatTime(timeObj) {
            const h = `${timeObj.hoursTens}${timeObj.hoursOnes}`;
            const m = `${timeObj.minutesTens}${timeObj.minutesOnes}`;
            const s = `${timeObj.secondsTens}${timeObj.secondsOnes}`;
            return `${h}:${m}:${s}`;
        }

        // ============================================
        // 设置所有数字显示
        // ============================================
        function setAllDigitsDisplay(timeObj) {
            Object.keys(clockState.digits).forEach(key => {
                clockState.digits[key].setDisplay(timeObj[key]);
            });
        }

        // ============================================
        // 绑定翻页片（FLIP_START 唯一执行）
        // 返回是否有任何翻页发生
        // ============================================
        function bindFlipPages(newTime, oldTime) {
            let hasFlip = false;

            Object.keys(clockState.digits).forEach(key => {
                const digit = clockState.digits[key];

                if (newTime[key] !== oldTime[key]) {
                    hasFlip = true;

                    // 先创建 DOM 元素
                    const flipElement = digit.createFlipElement(
                        newTime[key],    // topFace = 新数字
                        oldTime[key]     // bottomFace = 旧数字
                    );

                    // 再创建不可变的 FlipPage 对象（包含 element）
                    digit.flipPage = new FlipPage({
                        topFace: newTime[key],
                        bottomFace: oldTime[key],
                        element: flipElement
                    });

                    // ✅ 修复：添加动画完成事件监听器
                    const onAnimationEnd = () => {
                        flipElement.removeEventListener('animationend', onAnimationEnd);
                        flipElement.removeEventListener('webkitAnimationEnd', onAnimationEnd);
                        // 标记动画已完成，可以通过全局变量或状态跟踪
                        if (!window.flipAnimationCompleted) {
                            window.flipAnimationCompleted = [];
                        }
                        window.flipAnimationCompleted.push(digit.key);
                    };

                    flipElement.addEventListener('animationend', onAnimationEnd);
                    flipElement.addEventListener('webkitAnimationEnd', onAnimationEnd);

                    // 触发动画
                    requestAnimationFrame(() => {
                        flipElement.classList.add('flipping');
                    });
                }
            });

            return hasFlip;
        }

        // ============================================
        // 更新翻页动画（FLIPPING 状态）
        // ============================================
        function updateAllFlipAnimations() {
            // 检查是否还有翻页动画在进行
            const activeFlipPages = Object.values(clockState.digits).filter(digit => digit.flipPage !== null);
            
            if (activeFlipPages.length === 0) {
                return true; // 没有翻页片，完成
            }
            
            // 检查是否所有翻页片对应的动画都已完成
            const completedAnimations = window.flipAnimationCompleted || [];
            const allCompleted = activeFlipPages.every(digit => 
                completedAnimations.includes(digit.key) || 
                !digit.flipPage.element.classList.contains('flipping')
            );
            
            return allCompleted;
        }

        // ============================================
        // 提交翻页结果（FLIP_END 唯一执行）
        // ============================================
        function commitFlipResults() {
            // ✅ 修复问题1：严格按照文档中的正确顺序执行
            // 核心原则：DOM 显示不应该"等状态"，而应该"由动画结果直接驱动"

            // 步骤1：以 flipPage.topFace 为准，立即更新所有上下半静态显示
            Object.keys(clockState.digits).forEach(key => {
                const digit = clockState.digits[key];
                if (digit.flipPage) {
                    digit.setDisplay(digit.flipPage.topFace);
                }
            });

            // 步骤2：再统一写回 clockState.lastClockTime
            // ❗ 关键：这一步必须在所有 DOM 更新之后
            // 否则上半部分可能依赖旧的 lastClockTime
            Object.keys(clockState.digits).forEach(key => {
                const digit = clockState.digits[key];
                if (digit.flipPage) {
                    clockState.lastClockTime[key] = digit.flipPage.topFace;
                }
            });
            
            // 清理动画完成标记
            window.flipAnimationCompleted = [];
        }

        // ============================================
        // 销毁所有翻页片
        // ============================================
        function destroyAllFlipPages() {
            Object.values(clockState.digits).forEach(digit => {
                digit.destroyFlipElement();
            });
        }

        // ============================================
        // 停止所有动画
        // ============================================
        function stopAllAnimations() {
            destroyAllFlipPages();
            // 清理动画完成标记
            window.flipAnimationCompleted = [];
        }

        // ============================================
        // 更新状态显示
        // ============================================
        function updateStatusDisplay() {
            document.getElementById('status-state').textContent = clockState.state;
            document.getElementById('status-time').textContent = formatTime(clockState.lastClockTime);
        }

        // ============================================
        // 状态切换辅助函数
        // ============================================
        function transitionToState(newState, reason = '') {
            clockState.previousState = clockState.state;
            clockState.state = newState;
            console.log(`[STATE] ${clockState.previousState} → ${newState}${reason ? ' (' + reason + ')' : ''}`);
        }

        // ============================================
        // 主循环（状态机）
        // ============================================
        // 【设计说明】
        // 本翻页时钟采用严格状态机 + 逻辑时钟模型，通过：
        // 1. 翻页结果直接驱动 DOM（不等状态）
        // 2. lastClockTime 仅在受控节点修改
        // 3. 后台恢复时强制时间对齐（不补动画）
        // 
        // 避免了：
        // - 上下半显示不同步
        // - 后台恢复快翻
        // - 动画与时间源撕裂
        //
        // 【状态机职责表】
        // ┌────────────┬──────────────┬─────────────────────┐
        // │ 状态       │ 允许读取时间 │ 允许改 lastClockTime │
        // ├────────────┼──────────────┼─────────────────────┤
        // │ INIT       │ ✅           │ ✅ (初始化)          │
        // │ STABLE     │ ✅           │ ❌                  │
        // │ FLIP_START │ ❌           │ ❌                  │
        // │ FLIPPING   │ ❌ 纯动画态   │ ❌ 严格禁止          │
        // │ FLIP_END   │ ❌           │ ✅ (提交结果)        │
        // │ PAUSED     │ ✅           │ ✅ (时间对齐)        │
        // └────────────┴──────────────┴─────────────────────┘
        function tick() {
            switch (clockState.state) {
                
                case State.INIT:
                    // 初始化（唯一允许修改 lastClockTime 的地方之一）
                    clockState.lastClockTime = getNow();
                    setAllDigitsDisplay(clockState.lastClockTime);
                    transitionToState(State.STABLE);
                    break;
                    
                case State.STABLE:
                    // ✅ 修复问题2：如果刚从后台恢复，跳过第一次翻页检查
                    if (clockState.justResumed) {
                        clockState.justResumed = false;
                        console.log('[STABLE] 刚恢复，跳过本次翻页检查');
                        break;
                    }

                    // 检查页面可见性
                    if (!clockState.pageVisible) {
                        transitionToState(State.PAUSED, '页面不可见');
                        break;
                    }

                    // 检查时间变化（逐秒推进）
                    const realNow = getNow();
                    const logicalTime = clockState.lastClockTime;
                    
                    // ✅ 修复：将时间转换为总秒数以计算差距
                    const toSeconds = (t) => t.hoursTens * 100000 + t.hoursOnes * 10000 + t.minutesTens * 1000 + t.minutesOnes * 100 + t.secondsTens * 10 + t.secondsOnes;
                    const realSeconds = toSeconds(realNow);
                    const logicalSeconds = toSeconds(logicalTime);
                    const gap = realSeconds - logicalSeconds;
                    
                    if (gap > 1) {
                        // 滞后超过 1 秒，进入快速同步模式：跳过动画，直接对齐
                        console.warn(`[STABLE] 检测到严重滞后 (gap: ${gap}s)，强制同步时间`);
                        clockState.lastClockTime = realNow;
                        setAllDigitsDisplay(realNow);
                        // 保持在 STABLE 状态，不进入 FLIP 流程
                    } else {
                        // 正常运行：差距 <= 1 秒，执行标准翻页逻辑
                        const nextTime = incrementOneSecond(clockState.lastClockTime);
                        if (timeAfterOrEqual(realNow, nextTime)) {
                            clockState.currentTime = nextTime;
                            // 重置动画完成标记
                            window.flipAnimationCompleted = [];
                            transitionToState(State.FLIP_START);
                        }
                    }
                    break;
                    
                case State.FLIP_START: {
                    // 绑定翻页片（唯一绑定点）
                    const hasAnyFlip = bindFlipPages(
                        clockState.currentTime,
                        clockState.lastClockTime
                    );

                    if (hasAnyFlip) {
                        transitionToState(State.FLIPPING);
                    } else {
                        // ✅ 修复：无变化时返回 STABLE，防止死锁
                        console.warn('[FLIP_START] 无翻页变化，保持 STABLE 状态');
                        transitionToState(State.STABLE, '无变化');
                    }
                    break;
                }
                    
                case State.FLIPPING:
                    // ✅ 修复问题3：FLIPPING 状态下禁止读取当前时间
                    // ❌ 不允许调用 getNow()
                    // ❌ 不允许重新计算 digit 值
                    // ✅ 只允许推进动画
                    
                    // 检查中断
                    if (!clockState.pageVisible) {
                        transitionToState(State.PAUSED, '页面不可见');
                        break;
                    }
                    
                    // 推进动画（不读取时间！）
                    const allComplete = updateAllFlipAnimations();
                    
                    if (allComplete) {
                        transitionToState(State.FLIP_END);
                    }
                    break;
                    
                case State.FLIP_END:
                    // 提交结果（唯一修改 lastClockTime 的地方）
                    commitFlipResults();
                    // ✅ 修复：给DOM一点时间更新显示，再销毁翻页片
                    setTimeout(() => {
                        destroyAllFlipPages();
                        // 清理动画完成标记
                        window.flipAnimationCompleted = [];
                        transitionToState(State.STABLE);
                    }, 50); // 50ms 延迟确保DOM更新完成
                    break;
                    
                case State.PAUSED:
                    // ✅ 修复问题1：如果有正在进行的翻页，先提交结果，防止时间回滚/错位
                    const hasPendingFlip = Object.values(clockState.digits).some(d => d.flipPage !== null);
                    
                    if (hasPendingFlip) {
                        console.log('[PAUSED] 检测到翻页中断，强制提交当前翻页结果');
                        commitFlipResults(); // 确保 lastClockTime 和静态显示更新为翻页后的时间
                    }
                    
                    // 步骤1：停止所有动画
                    stopAllAnimations();

                    // 步骤2：等待页面恢复可见
                    if (clockState.pageVisible) {
                        // 方案1：PAUSED 状态强制时间同步（直接抹平时间差，不补翻页）
                        const resumeTime = getNow();
                        clockState.lastClockTime = resumeTime;
                        setAllDigitsDisplay(resumeTime);
                        console.log('[PAUSED→STABLE] 恢复可见，同步时间到', formatTime(resumeTime));

                        // 方案2：设置 justResumed 防抖标志（防止恢复后第一帧立即触发翻页）
                        clockState.justResumed = true;

                        transitionToState(State.STABLE, '页面恢复可见');
                    }
                    break;
            }

            // 更新状态显示
            updateStatusDisplay();
            
            // 继续循环
            requestAnimationFrame(tick);
        }

        // ============================================
        // 页面可见性监听
        // ============================================
        document.addEventListener('visibilitychange', () => {
            clockState.pageVisible = !document.hidden;
            console.log(`[VISIBILITY] 页面${clockState.pageVisible ? '可见' : '不可见'}`);
        });

        // ============================================
        // 启动
        // ============================================
        window.addEventListener('DOMContentLoaded', () => {
            initDigits();
            clockState.state = State.INIT;
            console.log('═══════════════════════════════════════════════════════════');
            console.log('[INIT] 翻页时钟启动');
            console.log('═══════════════════════════════════════════════════════════');
            console.log('[模型] 严格物理翻页 + 逐秒推进 + 不可回滚');
            console.log('');
            console.log('【问题1：翻页完成后上半部分立即更新】');
            console.log('  原因：静态显示依赖 lastClockTime，更新顺序错误');
            console.log('  方案：先更新所有 DOM 显示，再统一更新 lastClockTime');
            console.log('  原则：DOM 显示由动画结果直接驱动，不等状态');
            console.log('');
            console.log('【问题2：后台恢复不疯狂快翻】');
            console.log('  原因：逻辑时间与真实时间不同步，试图补历史翻页');
            console.log('  方案1：PAUSED 状态强制时间同步（直接抹平时间差）');
            console.log('  方案2：justResumed 防抖标志（跳过恢复后第一帧）');
            console.log('  原则：后台恢复 ≠ 补动画，而是一次性对齐真实时间');
            console.log('');
            console.log('【问题3：FLIPPING 状态禁止读取时间】');
            console.log('  原因：翻页中读时间会导致动画与数据源撕裂');
            console.log('  方案：强约束状态机职责，FLIPPING 是纯动画态');
            console.log('  原则：翻页过程中只推进动画，不修改任何时间逻辑');
            console.log('');
            console.log('【问题4：卡顿时追赶机制】');
            console.log('  原因：主线程阻塞导致逻辑时间严重滞后');
            console.log('  方案：检测时间差距，若>1秒则跳过动画直接对齐');
            console.log('  原则：严重滞后时不逐秒翻页，而是直接同步到真实时间');
            console.log('');
            console.log('【问题5：PAUSED状态翻页中断处理】');
            console.log('  原因：后台切换时翻页动画被强制停止');
            console.log('  方案：进入PAUSED前先提交翻页结果');
            console.log('  原则：防止翻页片被销毁但时间状态未更新导致错位');
            console.log('═══════════════════════════════════════════════════════════');
            requestAnimationFrame(tick);
        });

        // ============================================
        // 开发模式断言检查
        // ============================================
        if (true) { // 设为 false 可关闭检查
            let lastCheckTime = null;
            let getNowCallCount = 0;
            
            // 包装 getNow 以监控调用
            const originalGetNow = getNow;
            window.getNowDebug = function() {
                if (clockState.state === State.FLIPPING || 
                    clockState.state === State.FLIP_START || 
                    clockState.state === State.FLIP_END) {
                    console.warn('[ASSERT] 在禁止状态调用 getNow():', clockState.state);
                }
                return originalGetNow();
            };
            
            setInterval(() => {
                // ✅ 断言1：检查状态合法性
                const validStates = Object.values(State);
                if (!validStates.includes(clockState.state)) {
                    console.error('[ASSERT 1] 非法状态:', clockState.state);
                }

                // ✅ 断言2：检查翻页片冻结
                Object.values(clockState.digits).forEach(digit => {
                    if (digit.flipPage && !Object.isFrozen(digit.flipPage)) {
                        console.error('[ASSERT 2] 翻页片未冻结:', digit.key);
                    }
                });

                // ✅ 断言3：检查翻页片内容一致性
                Object.values(clockState.digits).forEach(digit => {
                    if (digit.flipPage) {
                        const frontText = digit.flipPage.element.querySelector('.flip-card-front .digit-value').textContent;
                        const backText = digit.flipPage.element.querySelector('.flip-card-back .digit-value').textContent;
                        
                        if (frontText !== String(digit.flipPage.bottomFace)) {
                            console.error('[ASSERT 3] 翻页片 front 内容不匹配:', digit.key, frontText, digit.flipPage.bottomFace);
                        }
                        if (backText !== String(digit.flipPage.topFace)) {
                            console.error('[ASSERT 3] 翻页片 back 内容不匹配:', digit.key, backText, digit.flipPage.topFace);
                        }
                    }
                });
                
                // ✅ 断言4：检查 FLIPPING 状态下 lastClockTime 不变（问题3）
                if (clockState.state === State.FLIPPING) {
                    const currentCheckTime = JSON.stringify(clockState.lastClockTime);
                    if (lastCheckTime !== null && lastCheckTime !== currentCheckTime) {
                        console.error('[ASSERT 4] FLIPPING状态下lastClockTime被修改！（违反职责表）', 
                            '之前:', lastCheckTime, '现在:', currentCheckTime);
                    }
                    lastCheckTime = currentCheckTime;
                } else {
                    lastCheckTime = JSON.stringify(clockState.lastClockTime);
                }
                
                // ✅ 断言5：检查翻页完成后上下半显示一致（问题1）
                if (clockState.state === State.STABLE) {
                    Object.values(clockState.digits).forEach(digit => {
                        const upperText = digit.upperElement.textContent;
                        const lowerText = digit.lowerElement.textContent;
                        if (upperText !== lowerText) {
                            console.error('[ASSERT 5] STABLE状态下上下半显示不一致（问题1未解决）:', 
                                digit.key, '上半:', upperText, '下半:', lowerText);
                        }
                    });
                }
                
                // ✅ 断言6：检查 FLIP_START 和 FLIP_END 不应有翻页片残留
                if (clockState.state === State.FLIP_START || clockState.state === State.STABLE) {
                    Object.values(clockState.digits).forEach(digit => {
                        if (digit.flipPage && clockState.state === State.STABLE) {
                            console.error('[ASSERT 6] STABLE状态下仍有翻页片残留:', digit.key);
                        }
                    });
                }
                
                // ✅ 断言7：检查 PAUSED 状态下不应有翻页片残留
                if (clockState.state === State.PAUSED) {
                    Object.values(clockState.digits).forEach(digit => {
                        if (digit.flipPage) {
                            console.error('[ASSERT 7] PAUSED状态下仍有翻页片残留:', digit.key);
                        }
                    });
                }
            }, 100);
        }
    </script>
